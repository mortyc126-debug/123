<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loading</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #101010;
            font-family: Arial, sans-serif;
            position: relative;
        }


        .splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            justify-content: center;
        }

        .icon img {
            width:75px;
            height:75px;
            margin-bottom: 20px;
        }


        .spinner {
            border: 4px solid #292929;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .footer-text {
            font-size: 12px;
            color: #777;
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="splash-screen">
        <div class="icon">
            <img src="data:image/png;base64,[BASE-ICO]" alt="App Icon">
        </div>
        <div class="spinner"></div>
    </div>
    <div class="footer-text" id="footer-text">
        © 2025 APPNAME. All Rights Reserved.
    </div>

    <script>
        const translations = {
            en: "© 2025 APPNAME. All Rights Reserved.",
            ar: "© 2025 APPNAME. جميع الحقوق محفوظة.",
            zh: "© 2025 APPNAME。版权所有。",
            ru: "© 2025 APPNAME. Все права защищены.",
            tr: "© 2025 APPNAME. Tüm Hakları Saklıdır."
        };
        const setLanguage = (lang) => {
            const footerText = document.getElementById("footer-text");
            footerText.textContent = translations[lang] || translations.en;
        };
        setLanguage('[LNG]');
    </script>
</body>

</html>
